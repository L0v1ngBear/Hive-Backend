server:
  port: 8080
  servlet:
    context-path: /api  # 全局上下文路径，所有请求都要带 /api 前缀

spring:
  profiles:
    active: dev  # 激活开发环境配置

mybatis-plus:
  type-aliases-package: my.Hive_Back.module.*.model.entity
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
  packages-to-scan: my.hive_back.api  # 只保留这行，其他的 path 和 url 全删掉！