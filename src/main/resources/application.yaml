server:
  port: 8080
  servlet:
    context-path: /api

spring:
  jackson:
    serialization:
      fail-on-empty-beans: false
  profiles:
    active: dev

mybatis-plus:
  type-aliases-package: my.hive_back.module.*.model.entity
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:xml/*.xml

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    use-root-path: false
    enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true

auth:
  allow-legacy-header: false
  token:
    expire-hours: 24
  login:
    max-fail-count: 5
    max-ip-fail-count: 20
    lock-minutes: 15

security:
  response:
    key: sygav9Iec4kZiRvivnwSVe3iWq66cTCleo8gr3qL2GyXTcQHXJ1E57ZqfhqfIyWp70Imy0rJ7ZkS5SI4T0asRQ==

redis:
  key-prefix:
    barCode:
      prefix: barcode:number:daily
    inventory:
    trend:
      today_in: inventory:today:in
      today_out: inventory:today:out
